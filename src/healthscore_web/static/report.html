<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Healthscore Report</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg" />
  <link rel="stylesheet" href="/static/styles.css?v=available-sources-2" />
  <link rel="stylesheet" href="/healthscore/static/healthscore.css?v=override-count" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <a href="/healthscore" class="brand-link" id="brand-home">
        <img src="/static/logo.svg" alt="" class="brand-mark" width="28" height="28" />
        <span class="brand-word">Cortex<span class="brand-sub">Healthscore</span></span>
      </a>
    </div>
    <div id="session" class="session hidden">
      <button
        type="button"
        id="user-badge"
        class="user-badge"
        aria-haspopup="menu"
        aria-expanded="false"
        aria-controls="user-menu"
        title="Account"
      >
        <img id="user-badge-img" alt="" referrerpolicy="no-referrer" hidden />
        <span id="user-badge-initials"></span>
      </button>
      <div id="user-menu" class="user-menu hidden" role="menu">
        <div class="user-menu-identity">
          <div id="user-menu-name" class="user-menu-name"></div>
          <div id="user-menu-email" class="user-menu-email"></div>
          <div id="user-menu-role" class="user-menu-role"></div>
        </div>
        <a class="user-menu-item" href="/healthscore" role="menuitem">Healthscore</a>
        <a class="user-menu-item" href="/healthscore/report" role="menuitem">Healthscore Report</a>
        <a class="user-menu-item" href="/kpis" role="menuitem">KPIs</a>
        <a id="btn-signout" class="user-menu-item" href="/auth/logout" role="menuitem">Sign out</a>
      </div>
    </div>
  </header>

  <main>
    <section id="hs-login" class="panel hidden">
      <img src="/static/logo.svg" alt="Cortex" class="login-mark" width="72" height="72" />
      <h1>Sign in</h1>
      <p class="muted">Google Workspace SSO is required to view Customer Health Score data.</p>
      <div id="hs-login-actions" class="row"></div>
      <p id="hs-login-error" class="error" hidden></p>
    </section>

    <section id="hs-report" class="panel hs-report hidden">
      <div class="hs-section-head">
        <div>
          <h2>Healthscore Report</h2>
          <p id="hs-report-summary" class="muted"></p>
        </div>
      </div>
      <p id="hs-report-error" class="error" hidden></p>
      <div class="hs-table-scroll">
        <table class="hs-report-table">
          <thead>
            <tr>
              <th id="hs-sort-score" aria-sort="descending"><button type="button" class="hs-report-sort">Score</button></th>
              <th id="hs-sort-entity" aria-sort="none"><button type="button" class="hs-report-sort">Entity</button></th>
              <th class="hs-col-center">Trend</th>
              <th class="hs-col-center">Analysis</th>
            </tr>
          </thead>
          <tbody id="hs-report-body">
            <tr><td colspan="4" class="muted">Scoring active entities…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog id="hs-analysis-dialog" aria-labelledby="hs-analysis-title">
    <form method="dialog" class="hs-analysis-dialog">
      <div class="hs-analysis-head">
        <h2 id="hs-analysis-title">Analysis</h2>
        <span id="hs-analysis-score" class="hs-band unscored">—</span>
      </div>
      <p id="hs-analysis-meta" class="muted"></p>
      <div id="hs-analysis-body" class="hs-analysis-body"></div>
      <p id="hs-analysis-error" class="error" hidden></p>
      <div class="form-actions">
        <button type="submit" class="secondary">Close</button>
      </div>
    </form>
  </dialog>

  <script src="/healthscore/static/report.js?v=override-count"></script>
</body>
</html>

# LeanDNA Customer Health Score — draft framework (config/healthscore_framework.yaml)
#
# Field names mirror config/my-metrics.yaml so the two catalogs can merge later:
#   description       — what is measured, where the number comes from, over what
#                       window, and how it turns into points. Specific enough to
#                       build a generator from; plain enough for a non-technical
#                       reader. Say plainly when a source or threshold is not
#                       yet defined instead of implying it exists.
#   owner             — owner email (defaults to `owner` at the top of this file)
#   metric-id         — LeanDNA Data API catalog id; null until one exists
#   metric-generator  — Python generator name; null when no generator exists yet
#   grain             — hourly | daily | weekly | monthly | quarterly; null when the
#                       source framework defines an event cadence instead (see
#                       cadence_note), which also blocks storage of a period key
#   tags              — lowercase grouping labels
#
# Health Score adds the weighting model the KPI registry does not have:
#   pillar, signal, metric, scoring, max_points, weight, data_source (a list;
#   one component can have several), automation (automated | manual | blocked),
#   status, target, target_direction.
#
#   target            — the raw value that earns full points, in the same unit as
#                       the reading; null when the scoring rule has no single
#                       numeric threshold (yes/no, categorical, undefined)
#   target_direction  — higher | lower; which side of the target is healthy.
#                       Required when target is set.
#
# Weights come from the source PDF. Rows the PDF left unresolved keep a null
# weight or null max_points and stay unscored; nothing here is invented.

version: 1
title: LeanDNA Customer Health Score
scope: Salesforce Customer Entity
configured_weight: 88
source_document: LeanDNA_Health_Score_Input_Framework - Input Framework.pdf
status: draft
owner: lindsay.brown@leandna.com
owner_display: Lindsay Brown
owner_role: Head of Customer Success
principles:
- Leading indicators should dominate the score.
- Missing or undefined inputs remain unscored; they are never silently treated as healthy.
- Override flags do not participate in the weighted average.
inputs:
- key: usage_level
  pillar: Product Adoption & Usage
  name: Usage level (breadth & depth)
  description: Share of the entity's buyers who were active in LeanDNA this week, from the CS Report week
    rows (a named Usage health component when present, otherwise Weekly Active Buyers %), averaged across
    the entity's factories and banded into 0–6 points.
  signal: leading
  metric: CSR automatic health/usage percentage
  scoring: No data=0; 0–30%=1; 31–50%=2; 51–65%=3; 66–80%=4; 81–92%=5; 93–100%=6
  max_points: 6
  target: 93
  target_direction: higher
  weight: 6
  data_source:
  - CS Report
  grain: weekly
  automation: automated
  status: defined
  owner: lindsay.brown@leandna.com
  metric-id: null
  metric-generator: get_usage_level
  unit: percent
  tags:
  - customer-success
  - healthscore
  - adoption
- key: usage_trend
  pillar: Product Adoption & Usage
  name: Usage trend / velocity
  description: 'Whether usage is rising, flat, or falling: percent change in the stored weekly Usage level
    percent from the oldest to the newest week inside the trailing 13 weeks. Needs at least two weekly
    readings; more than +10% is rising, more than -10% is falling.'
  signal: leading
  metric: Percent change in active usage over trailing 90 days
  scoring: Percent change of stored CSR usage % over trailing 13 weeks (or as many weekly points as exist,
    min 2). >+10%=5; within ±10%=3; <-10%=0. Insufficient history stays unscored.
  max_points: 5
  target: 10
  target_direction: higher
  weight: 5
  data_source:
  - CS Report
  grain: weekly
  automation: automated
  status: defined
  owner: lindsay.brown@leandna.com
  metric-id: null
  metric-generator: get_usage_trend
  unit: percent
  tags:
  - customer-success
  - healthscore
  - adoption

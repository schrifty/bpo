- key: champion_departure_external
  name: Champion / executive departure
  description: Flag raised when the entity's primary champion or economic buyer left during the trailing
    3 months, from the same Salesforce signal as Champion / stakeholder turnover. A primary champion is
    the Account executive sponsor, or a Contact whose buying role is Champion, Technical Buyer, or
    Executive Sponsor, or whose user role includes Buyer. An economic buyer is a Contact whose buying
    role is Budget Holder or Decision Maker. Leaving means Salesforce Contact history shows a move to a
    different Account, or a UserGems job-start date falls in that window. A title or role change does
    not count. The flag is on when someone left and off otherwise, including when the Account has none
    of these people. While it is on the health score is 0.
  data_source:
  - Salesforce
  grain: weekly
  automation: automated
  status: defined
  metric-id: null
  metric-generator: get_champion_turnover
  tags:
  - customer-success

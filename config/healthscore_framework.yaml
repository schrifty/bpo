    many records errored. On time scores 5 and under 15 minutes late scores 3; how a failed feed scores
    is not yet defined. Blocked until an Apex log of daily sync success, lateness, and record errors is
    available.
  signal: leading
  metric: Feed uptime, time since successful sync, and quality/error rate
  scoring: On time=5; successful <15 minutes late=3; failure scoring needs definition
  max_points: 5
  weight: 5
  data_source:
  - Data Pipeline
  grain: daily
  automation: blocked
  status: needs_source
  metric-id: null
  metric-generator: null
  tags:
  - customer-success
  - healthscore
  - adoption
  - data-integration

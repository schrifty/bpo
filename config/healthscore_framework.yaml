  signal: lagging
  metric: Verified outcomes per quarter
  scoring: 2+=6; 1–2=5; zero/unknown scoring needs clarification
  max_points: 6
  target: 2
  target_direction: higher
  weight: 6
  data_source:
  - Verified-outcome log
  grain: quarterly
  automation: blocked
  status: needs_source
  metric-id: null
  metric-generator: null
  tags:
  - customer-success
  - healthscore
  - value
- key: roi_multiple

  metric: Number of eight anchor workflows used in last 90 days
  scoring: 0–2=0; 3=2; 4+=5
  max_points: 5
  target: 4
  target_direction: higher
  weight: 5
  data_source:
  - Pendo
  grain: monthly
  automation: blocked
  status: needs_definition
  metric-id: null
  metric-generator: null
  tags:
  - customer-success
  - healthscore
  - adoption

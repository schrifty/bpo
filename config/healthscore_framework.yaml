- key: call_sentiment
  pillar: Voice of Customer / Sentiment
  name: Call sentiment / tone
  description: Tone of recorded Chorus meetings and dials in the trailing 30 days, separate from who
    did the talking. Chorus does not return a numeric sentiment field; each finished recording's
    summary contains the sentence "overall sentiment was …". Positive language in that clause is
    +1, negative language is -1, and a clause with both or neither is 0. The reading is the mean
    of those calls. A positive mean scores 2, a negative mean scores 0, and a mean of 0 scores 1.
    A recording with no such sentence is left out. An entity with no recorded call in the window
    scores 0. The Chorus account matches the Customer Entity, or the parent of one or more entities.
  signal: leading
  metric: Mean call sentiment from -1 to +1 over the trailing 30 days
  scoring: No calls=0; mean > 0 = 2; mean < 0 = 0; mean = 0 = 1
  max_points: 2
  weight: 2
  data_source:
  - Chorus
  grain: monthly
  automation: automated
  status: defined
  metric-id: null
  metric-generator: get_call_sentiment

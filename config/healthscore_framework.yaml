    into the talk time of every speaker, including speakers Chorus could not identify. The reading
    is that share across the window, as a percent. At or under 50% scores 2; over 50% scores 0.
    An entity with no recorded call in the window stays unscored. A recording with no talk-time
    split is left out, and an entity whose calls all lack that split stays unscored.
  signal: leading
  metric: Representative talk-time percent over the trailing 30 days
  scoring: No calls=unscored; <=50%=2; >50%=0

    max_points: 5
    weight: 5
    data_source: Pendo
    grain: monthly
    automation: blocked
    status: needs_definition
    notes: CS and Product must define and tag the eight anchors.
    metric-id: null
    metric-generator: null
    tags: [customer-success, healthscore, adoption]

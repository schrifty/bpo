  signal: leading
  metric: Weekly writeback use, yes/no
  scoring: Yes=2; no=0
  max_points: 2
  weight: 2
  data_source:
  - CS Report
  grain: weekly
  automation: blocked
  status: needs_source
  metric-id: null
  metric-generator: null
  tags:
  - customer-success
  - healthscore
  - adoption
- key: champion_login_continuity
  pillar: Product Adoption & Usage
  name: Champion login continuity
  description: Days since the most recent LeanDNA login among the entity's champions. A champion is
    the executive sponsor on the Salesforce Customer Entity Account, or a Contact on that Account
    whose buying role is Champion, Technical Buyer, or Executive Sponsor, or whose user role includes
    Buyer. Sponsor login is the Account's executive-sponsor last-login timestamp. Contact login is
    Pendo last visit. A login in the trailing 7 days scores 2. Named champions with no login in that
    window score 0. An Account with none of these people stays unscored.
  signal: leading
  metric: Days since a champion's last login
  scoring: Last login within 7 days=2; named champion with no login in that window=0; no executive
    sponsor, champion, technical buyer, or buyer stays unscored
  max_points: 2
  target: 7
  target_direction: lower
  weight: 2
  data_source:
  - Salesforce
  grain: weekly
  automation: automated
  status: defined
  owner: lindsay.brown@leandna.com
  metric-id: null
  metric-generator: get_champion_login_continuity
  unit: days
  tags:
  - customer-success
  - healthscore
  - adoption
- key: customer_data_delivery
  pillar: Product Adoption & Usage

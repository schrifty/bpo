    at 0, including a month with no tickets, scores 2. Any S1, S2, or jira_escalated ticket scores
    0. No JSM organization match stays unscored.
  signal: leading
  metric: Higher of Sev-1/2 percent and jira_escalated percent
  scoring: Both shares 0=2; any S1/S2 or jira_escalated=0; no JSM organization stays unscored
  max_points: 2
  target: 0
  target_direction: lower
  weight: 2
  data_source:
  - JIRA

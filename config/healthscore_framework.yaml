    business review. Held means the recording type is meeting and it was not a no-show. The Chorus account
    matches the Customer Entity, or the parent of one or more entities, and every entity under a matched
    parent gets those meetings. 80% or more scores 2, less scores 0. No scheduled meetings stays unscored.
  signal: leading
  metric: Percent held in trailing two quarters
  scoring: ≥80%=2; <80%=0
  max_points: 2
  target: 80
  target_direction: higher
  weight: 2
  data_source:
  - Chorus
  grain: monthly
  automation: automated
  status: defined
  metric-id: null
  metric-generator: get_meeting_cadence
  unit: percent
  tags:
  - customer-success
  - healthscore
  - relationship
- key: champion_turnover
  pillar: Relationship & Engagement
  name: Champion / stakeholder turnover
  description: Whether the entity's primary champion or economic buyer left during the trailing 3
    months. A primary champion is the Account executive sponsor, or a Contact whose buying role is
    Champion, Technical Buyer, or Executive Sponsor, or whose user role includes Buyer. An economic
    buyer is a Contact whose buying role is Budget Holder or Decision Maker. Leaving means Salesforce
    Contact history shows a move to a different Account, or a UserGems job-start date falls in that
    window. A title or role change does not count. Someone leaving scores -5. Otherwise the score is 5,
    including when the Account has none of these people. An Account missing from the executive-sponsor
    query stays unscored.
  signal: leading
  metric: Tracked-contact departure in the trailing 3 months
  scoring: Left within the trailing 3 months=-5; otherwise=5
  max_points: 5
  min_points: -5
  weight: 4
  data_source:
  - Salesforce
  grain: weekly
  automation: automated
  status: defined
  metric-id: null
  metric-generator: get_champion_turnover
  tags:
  - customer-success
  - healthscore
  - relationship
- key: enhancement_engagement
  pillar: Relationship & Engagement
  name: Enhancement Engagement & Delivery
  description: Aha Product Ideas submitted in the trailing 12 months by a customer portal user, and how
    many of those ideas were Shipped. Up to 3 points come from submitting requests, capped at 5 requests,
    and up to 7 points come from the share that shipped. The submitter's email domain matches an Aha idea
    organization, and every active Customer Entity under that organization's Salesforce Customer account
    gets the same counts. No requests in the window stays unscored.
  signal: leading
  metric: Aha Product Ideas requested and shipped in the trailing 12 months
  scoring: No requests=N/A. Otherwise min(10, 3 * min(R, 5) / 5 + 7 * D / R), one decimal. Shipped is
    the only delivered status.
  max_points: 10
  weight: 5
  data_source:

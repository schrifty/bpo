  name: ROI multiple
  description: Previous-period inventory-action savings from the CS Report, summed across the entity's
    factories, divided by the Customer Entity's Salesforce ARR. 7 times or more scores 6, from 5 up to
    7 scores 4, from 3 up to 5 scores 2, and under 3 scores 0. Missing savings or ARR stays unscored.
    No weight is set yet, so it does not count toward the score.
  signal: lagging
  metric: IA Previous Period Savings / Salesforce ARR
  scoring: 7x+=6; 5–<7x=4; 3–<5x=2; <3x=0
  max_points: 6
  target: 7
  target_direction: higher
  weight: null
  data_source:
  - CS Report
  - Salesforce
  grain: quarterly
  cadence_note: Quarterly; reset at renewal
  automation: automated
  status: needs_weight
  owner: lindsay.brown@leandna.com
  metric-id: null
  metric-generator: get_roi_multiple
  unit: multiple
  tags:
  - customer-success
  - healthscore
  - value

# LeanDNA Customer Health Score — draft framework (config/healthscore_framework.yaml)
#
# Field names mirror config/my-metrics.yaml so the two catalogs can merge later:
#   description       — what the input measures
#   owner             — owner email (defaults to `owner` at the top of this file)
#   metric-id         — LeanDNA Data API catalog id; null until one exists
#   metric-generator  — Python generator name; null when no generator exists yet
#   grain             — hourly | daily | weekly | monthly | quarterly; null when the
#                       source framework defines an event cadence instead (see
#                       cadence_note), which also blocks storage of a period key
#   tags              — lowercase grouping labels
#
# Health Score adds the weighting model the KPI registry does not have:
#   pillar, signal, metric, scoring, max_points, weight, data_source, automation,
#   status, notes.
#
# Weights come from the source PDF. Rows the PDF left unresolved keep a null
# weight or null max_points and stay unscored; nothing here is invented.

version: 1
title: LeanDNA Customer Health Score
scope: Salesforce Customer Entity
configured_weight: 83
source_document: LeanDNA_Health_Score_Input_Framework - Input Framework.pdf
status: draft
owner: lindsay.brown@leandna.com
owner_display: Lindsay Brown
owner_role: Head of Customer Success
principles:
  - Leading indicators should dominate the score.
  - Missing or undefined inputs remain unscored; they are never silently treated as healthy.
  - Override flags do not participate in the weighted average.
inputs:
  - key: usage_level
    pillar: Product Adoption & Usage
    name: Usage level (breadth & depth)
    description: CSR usage R/Y/G calculation.
    signal: leading
    metric: CSR automatic health/usage percentage
    scoring: "No data=0; 0–30%=1; 31–50%=2; 51–65%=3; 66–80%=4; 81–92%=5; 93–100%=6"
    max_points: 6
    weight: 6
    data_source: Apex / CSR
    grain: weekly
    automation: automated
    status: defined
    owner: lindsay.brown@leandna.com
    metric-id: null
    metric-generator: get_usage_level
    unit: percent
    tags: [customer-success, healthscore, adoption]
  - key: usage_trend
    pillar: Product Adoption & Usage
    name: Usage trend / velocity
    description: Direction and rate of change in usage over the trailing 30/60/90 days.
    signal: leading
    metric: Percent change in active usage over trailing 90 days
    scoring: "Percent change of stored CSR usage % over trailing 13 weeks (or as many weekly points as exist, min 2). >+10%=5; within ±10%=3; <-10%=0. Insufficient history stays unscored."
    max_points: 5
    weight: 5
    data_source: CSR or CSR downloads
    grain: weekly
    automation: automated
    status: defined
    owner: lindsay.brown@leandna.com
    metric-id: null
    metric-generator: get_usage_trend
    unit: percent
    tags: [customer-success, healthscore, adoption]

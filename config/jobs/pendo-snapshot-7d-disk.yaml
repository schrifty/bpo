name: pendo-snapshot-7d-disk
# Smoke-only. Partial refresh merges remaining disk windows into the shared
# manifest; it does not replace coverage with [7] alone.
stop_on_failure: true
fail_on_warnings: false
steps:
  - name: refresh-shared-pendo-snapshot-7d-disk
    command: refresh-pendo-snapshot
    windows: [7]
    upload_portfolio_days: 0

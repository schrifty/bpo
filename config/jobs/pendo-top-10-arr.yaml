    command: export-pendo-top-arr
    top_n: 10
    days: 30
    compare_days: 30
    require_pendo_snapshot: true
    require_pendo_windows: [7, 14, 30, 60]
  - name: pendo-top-10-arr-export-7d
    command: export-pendo-top-arr
    top_n: 10
    days: 7
    compare_days: 7
    require_pendo_snapshot: true
    require_pendo_windows: [7, 14, 30, 60]

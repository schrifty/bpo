# LeanDNA metric registry — config/my-metrics.yaml
#
# Keys are LeanDNA metric display names (owner: marc.schriftman@leandna.com, siteId 416).
# Populated from metrics-get-mine (Data API GET /data/identity + /data/Metric).
#
# Fields:
#   description       — Human-readable summary of what the metric measures; filled in for
#                       entries with a generator, null when not yet defined
#   metric-id         — Data API catalog id (same as app ndx); required before upsert unless
#                       already present in GET /data/Metric (create metrics in LeanDNA UI)
#   metric-generator  — Python function that computes the daily value when wired in Cortex;
#                       null when no generator exists in this repo yet
#   tags              — Optional list of lowercase labels for grouping/filtering KPIs
#                       (e.g. [engineering, delivery]). One KPI may carry many tags. Query
#                       all KPIs for a tag with current values via `metrics-by-tag --tag NAME`.
#
# Generator names refer to functions under src/ (e.g. jira_cycle_time.get_dev_team_cycle_times).

metrics:
  # Control Tower
  "Time to Value":
    description: null
    metric-id: 1860
    metric-generator: null
    tags: [control-tower, onboarding]

  # On-Time Performance
  "On Time Performance":
    description: null
    metric-id: 1745
    metric-generator: null
    tags: [supply-chain, delivery]

  # Customer-Reported Bugs
  "Customer-Reported Bugs":
    description: >-
      Count of open LEAN Bug issues in active engineering statuses (Open,
      Reopened, In Progress, In Review)—the same slice as the engineering
      portfolio Bug Health slide. Computed from Jira by get_customer_reported_bugs.
    metric-id: 2035
    metric-generator: get_customer_reported_bugs
    tags: [engineering, quality]

  # Tickets Beyond Service Thresholds
  "Tickets Beyond Service Thresholds":
    description: >-
      Count of open HELP (JSM) tickets at high priority (Critical, Blocker, or
      Major) that are not yet resolved, excluding operational noise labelled
      Outage or healthcheck. Computed from a Jira JQL count by
      get_service_threshold_tickets.
    metric-id: 2028
    metric-generator: get_service_threshold_tickets
    tags: [support, sla]

  # Site Uptime %
  "Site Uptime %":
    description: null
    metric-id: 1769
    metric-generator: null
    tags: [reliability, platform]

  # AI Token Usage
  "AI Token Usage":
    description: >-
      Total AI tokens (input + output) consumed by the team's Cursor usage over a
      trailing 30-day window, summed from Cursor Admin API usage events by
      get_ai_token_usage.
    metric-id: null
    metric-generator: get_ai_token_usage
    tags: [ai, engineering, adoption]

  # Median Time to Complete SUT (Weeks)
  "Median Time to Complete SUT (Weeks)":
    description: null
    metric-id: 2175
    metric-generator: null
    tags: [onboarding, delivery]

  # Sprint Delivery % - AUTOMATABLE
  "Sprint Delivery %":
    description: null
    metric-id: 2086
    metric-generator: null
    tags: [engineering, delivery]

  # TTFR (30 Days) - AUTOMATABLE
  "TTFR (30 Days)":
    description: null
    metric-id: null
    metric-generator: null
    tags: [support, sla]

  # SLA Adherence (30 Days) - AUTOMATABLE
  "SLA Adherence (30 Days)":
    description: null
    metric-id: null
    metric-generator: null
    tags: [support, sla]

  "Engineering Cycle Time (Sprint)":
    description: >-
      Median active in-progress cycle time across development boards, in days —
      time issues spend in working statuses (e.g. In Progress, In Review), not
      counting backlog wait. Computed from Jira changelogs by get_dev_team_cycle_times.
    metric-id: 2024
    metric-generator: get_dev_team_cycle_times
    tags: [engineering, delivery]

  "Engineering Lead Time (Days)":
    description: >-
      Median lead time across development boards, in days — calendar time from
      issue created to resolved. Reported as the median of each board's median
      lead time by get_dev_team_lead_time.
    metric-id: 2179
    metric-generator: get_dev_team_lead_time
    tags: [engineering, delivery]

  # Data Sync Failures (Month) - 2029
  "Data Sync Failures (Month)":
    description: null
    metric-id: null
    metric-generator: null
    tags: [reliability, data-integration]

  # Data Sync Failures (YTD) - 2031
  "Data Sync Failures (YTD)":
    description: null
    metric-id: null
    metric-generator: null
    tags: [reliability, data-integration]

  # 2076
  "KPI Automation %":
    description: >-
      Count of fully-defined metrics in this registry (those having both a
      metric-id and a metric-generator), produced by get_kpi_automation_pct as
      the KPI automation numerator.
    metric-id: null
    metric-generator: get_kpi_automation_pct
    tags: [automation, ops]

  # 2077
  "QBR Automation %":
    description: null
    metric-id: null
    metric-generator: null
    tags: [automation, ops]

  # 2085
  "Team Performance (Onshore vs. Offshore)":
    description: null
    metric-id: null
    metric-generator: null
    tags: [engineering, delivery]

  "Sprint Story Points Delivered":
    description: >-
      Total story points completed in the most recent sprint across development
      boards, aggregated from Jira by get_sprint_story_points_by_team.
    metric-id: null
    metric-generator: get_sprint_story_points_by_team
    tags: [engineering, delivery]

  # 2087
  "AI Usage/Effectiveness":
    description: null
    metric-id: null
    metric-generator: null
    tags: [ai, adoption]

  # ── Engineering MFR scorecard (board-level AI adoption & impact) ──
  "% WAU":
    description: >-
      Percentage of engineers actively using AI tools each week. Weekly active
      Cursor users on Dev - * Atlassian teams ÷ engineering headcount
      (get_wau_pct).
    metric-id: null
    metric-generator: get_wau_pct
    tags: [mfr, engineering, adoption, ai]

  "% AI-Assisted PRs":
    description: >-
      Percentage of code changes significantly supported by AI
      (AI-assisted PRs ÷ total PRs). Generator blocked until a reliable
      per-PR AI-assistance signal exists (Cursor/GitHub agent attribution,
      label, check, or commit trailer).
    metric-id: null
    metric-generator: null
    tags: [mfr, engineering, adoption, ai]

  "% AI-Assisted Automated PRs":
    description: >-
      Percentage of code changes created by AI (AI-automated PRs ÷ total PRs).
      Generator blocked until an explicit AI-created/agent PR flag is available
      (distinct from assisted).
    metric-id: null
    metric-generator: null
    tags: [mfr, engineering, adoption, ai]

  "Tokens / Dev":
    description: >-
      How heavily engineers are using AI tools: total Cursor model tokens
      (input + output) over the trailing window ÷ Dev - * engineering
      headcount (get_tokens_per_dev).
    metric-id: null
    metric-generator: get_tokens_per_dev
    tags: [mfr, engineering, adoption, ai]

  "AI Spend %":
    description: >-
      Share of engineering spend dedicated to AI tools and models
      ((AI tooling + model/API spend) ÷ total engineering spend). Generator
      blocked until total engineering spend (payroll/opex) is available;
      Cursor AI spend alone is not enough.
    metric-id: null
    metric-generator: null
    tags: [mfr, engineering, adoption, ai]

  "PRs Merged":
    description: >-
      Amount of development work completed and approved: engineer-scoped
      GitHub pull requests merged in the trailing window (get_prs_merged).
    metric-id: null
    metric-generator: get_prs_merged
    tags: [mfr, engineering, impact, delivery]

  "Defect Introduction Rate":
    description: >-
      Percentage of new bugs introduced into released software (new defects
      tied to recent releases ÷ total shipped work). Generator blocked until
      a defined defect→release link exists (fix version, release notes, or
      post-deploy window).
    metric-id: null
    metric-generator: null
    tags: [mfr, engineering, impact, quality]

  "Issues Shipped":
    description: >-
      Completed engineering tasks delivered in the period: LEAN issues in
      statusCategory Done with resolved date in the trailing window
      (get_issues_shipped).
    metric-id: null
    metric-generator: get_issues_shipped
    tags: [mfr, engineering, impact, delivery]

  "% Growth Allocation":
    description: >-
      Share of engineering capacity on growth/roadmap work: planned (non-reactive)
      LEAN Done issues ÷ all LEAN Done issues in the window. Reactive =
      Bug/Incident/Escalation types and escalation labels
      (get_growth_allocation_pct).
    metric-id: null
    metric-generator: get_growth_allocation_pct
    tags: [mfr, engineering, impact, delivery]

  "Headcount + AI Spend / Issue":
    description: >-
      Total cost to deliver one unit of engineering work
      ((engineering headcount cost + AI spend) ÷ issues shipped). Generator
      blocked until engineering headcount cost ($) is available from finance/HR.
    metric-id: null
    metric-generator: null
    tags: [mfr, engineering, impact, ai]

  "AI Spend / Issue":
    description: >-
      AI cost associated with delivering one unit of engineering work:
      engineer-scoped Cursor spend (USD) ÷ Issues Shipped in the same window
      (get_ai_spend_per_issue).
    metric-id: null
    metric-generator: get_ai_spend_per_issue
    tags: [mfr, engineering, impact, ai]
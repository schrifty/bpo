# LeanDNA metric registry — config/my-metrics.yaml
#
# Keys are LeanDNA metric display names (owner: marc.schriftman@leandna.com, siteId 416).
# Populated from metrics-get-mine (Data API GET /data/identity + /data/Metric).
#
# KPI definitions are storage-independent: a generator produces a live value for decks
# and CLIs without a LeanDNA catalog id. Reads are live by default. SQLite (kpi-snapshot)
# is Cortex stored history; LeanDNA Data API persistence is explicit
# (`metrics-upsert` / kpi_service.materialize_kpi) — generating never writes.
# Add/edit/delete rows with `cortex kpi add|edit|delete|show` (``cortex --kpi``).
#
# Fields:
#   description       — Human-readable summary of what the metric measures; filled in for
#                       entries with a generator, null when not yet defined
#   mgmt_guidance     — Two sentences max: how to manage to this KPI
#   metric-id         — Optional Data API catalog id (same as app ndx). Required only to
#                       write LeanDNA MetricDataPoint rows, or to inspect them via
#                       `metrics-by-tag --mode leandna` (create metrics in LeanDNA UI).
#                       Live and SQLite stored resolve do not need it.
#   metric-generator  — Python function that computes the value when wired in Cortex;
#                       null when no generator exists in this repo yet
#   tags              — Optional list of lowercase labels for grouping/filtering KPIs
#                       (e.g. [engineering, impact]). One KPI may carry many tags. Query
#                       with `metrics-by-tag <tag>` (live by default).
#
# SDD transition taxonomy (tags, because `cortex kpi edit` only round-trips the fields
# listed here — a bespoke top-level key would be silently dropped on the next edit):
#   legacy   — Measures delivery in the pre-SDD unit of work (ticket, sprint, PR).
#              Keep reporting until Spec-Driven Dev is adopted, then sunset.
#   forward  — Still meaningful after full SDD adoption: spec-based flow, durable
#              quality/reliability outcomes, and cost measured against business value.
#   pending  — Registered on purpose but not instrumentable yet. No generator, no target.
#              The description records what unblocks it. Never treat a pending row as a
#              miss; it has no value, not a bad value.
# Every `engineering`-tagged row carries exactly one of legacy | forward, except rows
# that are also tagged `support` — on those, `engineering` names the escalation target,
# not the owning function. Support and implementation KPIs are out of scope for this
# taxonomy: SDD does not retire them.
#   target            — Optional numeric goal (same unit as the generator value). Used by
#                       metrics-digest for off-target classification.
#   direction         — higher | lower — required when target is set. lower = off when
#                       value > target; higher = off when value < target.
#   unit              — Optional display unit for metrics-digest: ``currency`` (USD),
#                       ``percent`` (append %). Names ending/starting with ``%`` are
#                       treated as percent when unit is omitted. Plain numbers use
#                       thousands separators.
#
# Generator names refer to functions under src/ (e.g. jira_cycle_time.get_dev_team_cycle_times).
# Resolve modes: live (default) | stored (SQLite) | leandna (see src/kpi_service.py).

metrics:
  # Control Tower
  "Time to Value":
    description: null
    mgmt_guidance: >-
      Track onboarding cycle time and intervene when implementations stall.
      This is not a HELP-queue metric.
    metric-id: 1860
    metric-generator: null
    tags: [control-tower, onboarding]

  # On-Time Performance
  "On Time Performance":
    description: null
    mgmt_guidance: >-
      Manage supply-chain delivery against the committed date.
      Misses are execution issues, not ticket volume.
    metric-id: 1745
    metric-generator: null
    tags: [supply-chain]

  # Customer-Reported Bugs (month-close created count)
  "Customer-Reported Bugs":
    description: >-
      LEAN Bug issues labeled jira_escalated created in the previous calendar
      month (HELP escalations into engineering). Intake still sometimes includes
      enhancement requests; treat the count as provisional until that is fixed.
    mgmt_guidance: >-
      Drive the monthly LEAN jira_escalated Bug count toward 15 or below, but treat the
      target as asterisked: some rows are enhancement requests, not defects.
      A jump may be product quality or intake change, not more HELP volume.
    metric-id: null
    metric-generator: get_customer_reported_bugs_created
    tags: [engineering, quality, legacy]
    target: 15
    direction: lower

  # Site Uptime %
  "Site Uptime %":
    description: null
    mgmt_guidance: >-
      Protect platform availability and page on sustained drops below high-nines;
      this is infrastructure, not support staffing.
      Superseded by SLO Attainment % once error budgets are defined.
    metric-id: 1769
    metric-generator: null
    tags: [reliability, platform, legacy]

  # AI Token Usage
  "AI Token Usage":
    description: Cursor tokens used in the last 30 days.
    mgmt_guidance: >-
      Watch 30-day Cursor token volume as an adoption and cost leading indicator.
      Investigate spikes for waste or a new team rollout.
    metric-id: null
    metric-generator: get_ai_token_usage
    tags: [ai, engineering, forward]

  "Monthly AI Spend":
    description: Projected Cursor AI spend (USD) for this calendar month.
    mgmt_guidance: >-
      Manage in-month Cursor spend against finance expectations.
      Pair with Token Cost per Dev before cutting tools.
    metric-id: null
    metric-generator: get_monthly_ai_spend
    tags: [enterprise, finance]
    unit: currency

  # Median Time to Complete SUT (Weeks)
  "Median Time to Complete SUT (Weeks)":
    description: null
    mgmt_guidance: >-
      Shorten new-site SUT cycle time; long values mean onboarding is stuck.
      Do not mix this with HELP time to resolution.
    metric-id: 2175
    metric-generator: null
    tags: [onboarding]

  # Sprint Delivery %
  "Sprint Delivery %":
    description: >-
      Unweighted mean of per-board delivery % (issues Done ÷ issues committed)
      for the latest closed sprint on each configured scrum board.
    mgmt_guidance: >-
      Hold teams to completing the committed sprint (target 80% or higher).
      Chronic misses are planning or WIP problems.
    metric-id: 2086
    metric-generator: get_sprint_delivery_by_team
    tags: [engineering, legacy]
    unit: percent
    target: 80
    direction: higher

  # TTFR (30 Days)
  "TTFR (30 Days)":
    description: >-
      Median HELP Time to first response (JSM SLA) in hours, last 30 days
      (resolved tickets with a completed TTFR cycle).
    mgmt_guidance: >-
      Customers should hear back within 48 hours; about one hour is healthy.
      Do not celebrate TTFR if P90 TTR and SLA adherence are still failing.
    metric-id: null
    metric-generator: get_median_ttfr
    tags: [support, sla, care]
    target: 48
    direction: lower

  # Median TTR
  "Median TTR":
    description: Median HELP time-to-resolution (days), last 30 days.
    mgmt_guidance: >-
      Keep typical resolution at or below 6.67 days.
      Use this for the median customer; the tail is P90 TTR.
    metric-id: 2171
    metric-generator: get_median_ttr
    tags: [support, sla, care]
    target: 6.67
    direction: lower

  # SLA Adherence (30 Days)
  "SLA Adherence (30 Days)":
    description: >-
      Percent of HELP tickets resolved in the last 30 days with a completed
      TTFR or TTR SLA cycle that did not breach any measured cycle.
    mgmt_guidance: >-
      Hold at least 90% of measured resolved tickets to TTFR or TTR.
      Below that, inspect breaches by queue before adding headcount.
    metric-id: null
    metric-generator: get_sla_adherence
    tags: [support, sla, care]
    unit: percent
    target: 90
    direction: higher

  "HELP Resolved / Created":
    description: >-
      HELP tickets resolved ÷ HELP tickets created × 100 in the previous
      calendar month (excl. Outage/Healthcheck). Same month as Ticket Count.
    mgmt_guidance: >-
      Below 100% means the backlog grew that month; a healthy steady state is
      about 95–110%. Readings at 160%+ are a drawdown phase, not a forever target.
    metric-id: null
    metric-generator: get_help_resolved_created_ratio
    tags: [support, throughput]
    unit: percent
    target: 100
    direction: higher

  "Ticket Count":
    description: >-
      HELP tickets created in the previous calendar month (excl. Outage/Healthcheck).
      Payload includes created_per_business_day. HELP volume dropped sharply after
      January 2026 (457 created that month vs ~80–120 thereafter); treat that as a
      series break until the cause is named.
    mgmt_guidance: >-
      Use this month-close count as the volume baseline and compare months with
      created per business day. Do not set a target until the February 2026 drop is explained.
    metric-id: null
    metric-generator: get_help_ticket_count
    tags: [support, volume]

  "Support FTE":
    description: >-
      Finance-configured support headcount (CORTEX_SUPPORT_FTE). Not inferred
      from ticket volume.
    mgmt_guidance: >-
      This is the finance headcount constant for support.
      Confirm it when people join or leave; do not infer FTE from Ticket Count.
    metric-id: null
    metric-generator: get_support_fte
    tags: [support, finance]

  "Tickets per FTE":
    description: >-
      HELP tickets created in the previous calendar month ÷ CORTEX_SUPPORT_FTE
      (same window as Ticket Count).
    mgmt_guidance: >-
      Created HELP per support FTE in the previous calendar month.
      A drop with unchanged FTE is utilization, not a quality win — check P90 TTR and Open HELP >30d %.
    metric-id: null
    metric-generator: get_tickets_per_fte
    tags: [support, finance]

  "Support Spend / Ticket":
    description: >-
      Monthly support headcount/opex (CORTEX_MONTHLY_SPEND_USD_SUPPORT) ÷ HELP
      tickets created in the previous calendar month. Derived demand-side cost;
      same window as Ticket Count. No target until the volume regime is named.
    mgmt_guidance: >-
      Treat this as demand-side cost (opex ÷ created HELP), not the number to staff from.
      Rising $ with flat opex is a volume story; pair with P90 TTR, SLA, and Open HELP >30d % before calling it efficiency.
    metric-id: null
    metric-generator: get_support_spend_per_ticket
    tags: [support, finance]
    unit: currency

  "Support Spend / Resolved":
    description: >-
      Monthly support headcount/opex (CORTEX_MONTHLY_SPEND_USD_SUPPORT) ÷ HELP
      tickets resolved in the previous calendar month. Fairer than spend per
      created ticket during a backlog drawdown. No target until the volume
      regime is named.
    mgmt_guidance: >-
      This is cost per closed ticket in the same month as Ticket Count.
      During a drawdown (Resolved/Created well above 100%) this is the fairer efficiency read than spend per created ticket.
    metric-id: null
    metric-generator: get_support_spend_per_resolved
    tags: [support, finance]
    unit: currency

  "HELP Fully Loaded $ / Ticket":
    description: >-
      (Support opex + engineering and data jira_escalated tickets × engineering
      opex per LEAN issue shipped) ÷ HELP created, previous calendar month.
      Crude fully loaded cost of a HELP-originated problem. Not a target match
      to engineering Headcount + AI Spend / Issue.
    mgmt_guidance: >-
      Support opex plus Data and Engineering follow-on priced at engineering opex per shipped issue.
      Do not compare this to the engineering $1,600/issue target; it is the HELP-originated cost of a customer problem.
    metric-id: null
    metric-generator: get_help_fully_loaded_spend_per_ticket
    tags: [support, finance]
    unit: currency

  "Engineering Escalations":
    description: >-
      LEAN tickets created with label jira_escalated in the previous calendar
      month (excl. Epic/SUT). Primary engineering-escalation KPI; same month as
      Ticket Count.
    mgmt_guidance: >-
      Manage the LEAN jira_escalated count, not the rate, on the same month as Ticket Count.
      A stable count with a rising rate usually means HELP volume fell, not that engineering got worse.
    metric-id: null
    metric-generator: get_engineering_escalation_count
    tags: [support, escalation, engineering]

  "Engineering Escalation Rate":
    description: >-
      LEAN jira_escalated created ÷ HELP tickets created, previous calendar month
      (excl. Epic/SUT on escalations; excl. Outage/Healthcheck on HELP). Derived
      from Engineering Escalations and Ticket Count.
    mgmt_guidance: >-
      Use this percentage as context only after a volume-regime change.
      Do not steer staffing off the rate when the underlying count is stable.
    metric-id: null
    metric-generator: get_engineering_escalation_rate
    tags: [support, escalation, engineering]
    unit: percent

  "Data Escalations":
    description: >-
      CUSTOMER tickets created with label jira_escalated in the previous calendar
      month (excl. Epic/SUT). Primary data-escalation KPI; same month as Ticket Count.
    mgmt_guidance: >-
      Manage the CUSTOMER jira_escalated count on the same month as Ticket Count.
      Decide whether Data tickets are the intended path before treating a high count as a support miss.
    metric-id: null
    metric-generator: get_data_escalation_count
    tags: [support, escalation, data-integration]

  "Data Escalation Rate":
    description: >-
      CUSTOMER jira_escalated created ÷ HELP tickets created, previous calendar
      month (excl. Epic/SUT on escalations; excl. Outage/Healthcheck on HELP).
      Derived from Data Escalations and Ticket Count.
    mgmt_guidance: >-
      This is the share of HELP that spawned Data work, often 60%+ recently.
      Do not apply a lower-is-better target until routing intent is explicit.
    metric-id: null
    metric-generator: get_data_escalation_rate
    tags: [support, escalation, data-integration]
    unit: percent

  "Open HELP":
    description: >-
      HELP tickets still open at the snapshot date (excl. Outage/Healthcheck),
      including tickets later resolved after that date when rebuilding history.
    mgmt_guidance: >-
      Manage the open stock; a falling count with Resolved/Created at or above 100% is a healthy drawdown.
      This is the missing stock counterpart to monthly flow.
    metric-id: null
    metric-generator: get_open_help
    tags: [support, backlog]

  "Open HELP >30d %":
    description: >-
      Share of open HELP (as of the snapshot date) whose created date is more
      than 30 days earlier (excl. Outage/Healthcheck).
    mgmt_guidance: >-
      Drive the share of open HELP older than 30 days down; that is stuck work, not new intake.
      Pair with Open HELP Waiting on Us >30d % so customer-held tickets are not mixed in.
    metric-id: null
    metric-generator: get_open_help_over_30d_pct
    tags: [support, backlog, care]
    unit: percent

  "HELP Reopen %":
    description: >-
      HELP tickets whose status left Closed or Resolved in the previous
      calendar month ÷ HELP tickets resolved that month × 100 (excl.
      Outage/Healthcheck). Quality of resolution; no target until volume is visible.
    mgmt_guidance: >-
      This is tickets that left Done and came back, as a share of tickets resolved that month.
      A rising reopen share means TTR may look better because work was closed too early.
    metric-id: null
    metric-generator: get_help_reopen_pct
    tags: [support, care]
    unit: percent

  "Open HELP Waiting on Customer %":
    description: >-
      Share of open HELP (as of the snapshot date) whose status that day was
      Waiting for customer (excl. Outage/Healthcheck).
    mgmt_guidance: >-
      This is customer-held open work; do not treat it as a support delay.
      Pair with Open HELP Waiting on Us >30d % when P90 TTR is long.
    metric-id: null
    metric-generator: get_open_help_waiting_on_customer_pct
    tags: [support, care, backlog]
    unit: percent

  "Open HELP Waiting on Us >30d %":
    description: >-
      Share of open HELP (as of the snapshot date) that is more than 30 days
      old and was not Waiting for customer that day (excl. Outage/Healthcheck).
    mgmt_guidance: >-
      Drive aged open HELP that is still on us (support, engineering, or data).
      That is stuck customer-visible work; do not mix it with waiting-on-customer stock.
    metric-id: null
    metric-generator: get_open_help_waiting_on_us_over_30d_pct
    tags: [support, care, backlog]
    unit: percent

  "P90 TTR (30 Days)":
    description: >-
      90th percentile HELP Time to resolution (JSM SLA) in days, last 30 days
      (resolved tickets with a completed TTR cycle).
    mgmt_guidance: >-
      Kill the long tail; target is 10 days or less.
      If median TTR is fine and P90 is not, the problem is stuck tickets, not average speed.
    metric-id: null
    metric-generator: get_p90_ttr
    tags: [support, sla, care]
    target: 10
    direction: lower

  "Engineering Cycle Time (Sprint)":
    description: Median in-progress cycle time (days) across dev boards, last 30 days.
    mgmt_guidance: >-
      Keep in-progress work moving (target at most 1 day median).
      Rising cycle time is a WIP or review bottleneck.
    metric-id: 2024
    metric-generator: get_dev_team_cycle_times
    tags: [engineering, legacy]
    target: 1
    direction: lower

  "Engineering Lead Time (Days)":
    description: Median create-to-resolve lead time (days) across dev boards, last 30 days.
    mgmt_guidance: >-
      Keep create-to-resolve near 14 days or less.
      This is delivery latency, not HELP TTR.
    metric-id: 2179
    metric-generator: get_dev_team_lead_time
    tags: [engineering, legacy]
    target: 14
    direction: lower

  # Data Sync Failures (Month) - 2029
  "Data Sync Failures (Month)":
    description: null
    mgmt_guidance: >-
      Drive monthly sync failures down; each failure is a customer-visible data miss.
      Wire a generator before managing to a number.
    metric-id: null
    metric-generator: null
    tags: [reliability, data-integration]

  # Data Sync Failures (YTD) - 2031
  "Data Sync Failures (YTD)":
    description: null
    mgmt_guidance: >-
      Watch year-to-date accumulation; a calm month can still leave residual YTD risk.
      Wire a generator before managing to a number.
    metric-id: null
    metric-generator: null
    tags: [reliability, data-integration]

  # 2076
  "KPI Automation %":
    description: Share of registry KPIs with both an id and a generator.
    mgmt_guidance: >-
      Raise the share of catalog rows that are actually generated (target 90%).
      Gaps here mean the scorecard is still manual.
    metric-id: null
    metric-generator: get_kpi_automation_pct
    tags: [automation, ops]
    unit: percent
    target: 90
    direction: higher

  # 2085
  "Team Performance (Onshore vs. Offshore)":
    description: null
    mgmt_guidance: >-
      Use this only once it is defined and wired; do not infer it from sprint delivery alone.
      Until then this row is a placeholder.
    metric-id: null
    metric-generator: null
    tags: [engineering, legacy]

  "Sprint Story Points Delivered":
    description: Story points completed in the latest sprint across boards.
    mgmt_guidance: >-
      Track completed points (target 150) as capacity output, not quality.
      Pair with defects and cycle time.
    metric-id: null
    metric-generator: get_sprint_story_points_by_team
    tags: [engineering, legacy]
    target: 150
    direction: higher

  # 2087
  "AI Usage/Effectiveness":
    description: null
    mgmt_guidance: >-
      Placeholder until the generator exists.
      Do not manage the org to this name until it has a definition.
    metric-id: null
    metric-generator: null
    tags: [ai]

  # ── Engineering MFR scorecard (board-level AI adoption & impact) ──
  "Weekly Active AI Users":
    description: "% of Engineering using Cursor in the last 7 days (excl. Data Implementation)."
    mgmt_guidance: >-
      Keep 100% of Engineering on Cursor in the last 7 days.
      Any drop is an adoption or access issue, not a utilization tradeoff.
    metric-id: null
    metric-generator: get_weekly_active_ai_users
    tags: [engineering, ai, AKKR, forward]
    unit: percent
    target: 100
    direction: higher

  "% AI-Assisted PRs":
    description: >-
      Estimated share of merged PRs that are AI-assisted, previous calendar month —
      AI Code Share % applied to merged PR volume (commit attribution is too weak).
    mgmt_guidance: >-
      Hold at least 90% of merged PRs as AI-assisted.
      This is the same series family as AI Code Share; do not tell conflicting stories.
    metric-id: null
    metric-generator: get_ai_assisted_prs_pct
    tags: [engineering, ai, AKKR, legacy]
    unit: percent
    target: 90
    direction: higher

  "AI Code Share":
    description: >-
      Cursor-attributed lines ÷ total changed lines in commits, previous calendar month
      (Engineering Department; Cursor daily-usage AI Share signal).
    mgmt_guidance: >-
      Hold at least 80% of changed lines as Cursor-attributed.
      Investigate if this and % AI-Assisted PRs diverge sharply.
    metric-id: null
    metric-generator: get_ai_code_share
    tags: [engineering, ai, AKKR, forward]
    unit: percent
    target: 80
    direction: higher

  "Tokens per Dev":
    description: Cursor tokens ÷ Engineering headcount, previous calendar month (excl. Data Implementation).
    mgmt_guidance: >-
      Track tokens per engineer over time; there is no target, because a floor would be
      arbitrary until we know what healthy usage looks like.
      Collapses still mean the tool is not in the workflow.
    metric-id: null
    metric-generator: get_tokens_per_dev
    tags: [engineering, ai, AKKR, forward]

  "Token Cost per Dev":
    description: Engineer Cursor spend (USD) ÷ Engineering headcount, previous calendar month (excl. Data Implementation).
    mgmt_guidance: >-
      Aim for about $250 per engineer as spend that matches usage, not as a cost-cut target.
      Pair with Tokens per Dev.
    metric-id: null
    metric-generator: get_token_cost_per_dev
    tags: [engineering, ai, AKKR, forward]
    unit: currency
    target: 250
    direction: higher

  "AI Spend %":
    description: This-month Cursor AI spend ÷ monthly engineering spend.
    mgmt_guidance: >-
      Grow Cursor spend toward 5% of engineering opex if adoption is working.
      Do not cut this in isolation when delivery KPIs are up.
    metric-id: null
    metric-generator: get_ai_spend_pct
    tags: [engineering, ai, AKKR, forward]
    unit: percent
    target: 5
    direction: higher

  "PRs Merged":
    description: Engineer GitHub PRs merged in the previous calendar month.
    mgmt_guidance: >-
      Hit at least 500 engineer PRs in the month.
      A miss with high AI share is a throughput problem, not an AI problem.
    metric-id: null
    metric-generator: get_prs_merged
    tags: [engineering, impact, AKKR, legacy]
    target: 500
    direction: higher

  "Defects per 100 Issues":
    description: LEAN bugs created ÷ issues shipped × 100, previous calendar month.
    mgmt_guidance: >-
      Keep at most 15 bugs per 100 shipped issues.
      Rising defects with high growth allocation means quality is the constraint.
    metric-id: null
    metric-generator: get_defects_per_100_issues
    tags: [engineering, impact, quality, AKKR, legacy]
    unit: percent
    target: 15
    direction: lower

  "Issues Shipped":
    description: >-
      Actual LEAN issues Done in the previous calendar month; no extrapolation.
    mgmt_guidance: >-
      Hit at least 280 Done issues in the month.
      This is the output denominator for several impact KPIs.
    metric-id: null
    metric-generator: get_issues_shipped
    tags: [engineering, impact, AKKR, legacy]
    target: 280
    direction: higher

  "% Growth Allocation":
    description: >-
      Planned LEAN Done work ÷ eligible Done work (excludes bugs and tech-debt),
      previous calendar month.
    mgmt_guidance: >-
      Keep at least 90% of eligible Done work as planned or growth.
      Bugs and tech-debt crowding this out is what to manage down.
    metric-id: null
    metric-generator: get_growth_allocation_pct
    tags: [engineering, impact, AKKR, legacy]
    unit: percent
    target: 90
    direction: higher

  "Headcount + AI Spend / Issue":
    description: (Monthly eng headcount + AI spend) ÷ issues shipped, previous calendar month.
    mgmt_guidance: >-
      Drive fully loaded cost per shipped issue toward $1,600 or less.
      Improvements can be more output or less cost, not vanity savings.
    metric-id: null
    metric-generator: get_headcount_plus_ai_spend_per_issue
    tags: [engineering, impact, ai, AKKR, legacy]
    unit: currency
    target: 1600
    direction: lower

  "AI Spend / Issue":
    description: Engineer Cursor spend (USD) ÷ issues shipped, previous calendar month.
    mgmt_guidance: >-
      Track Cursor dollars per shipped issue over time; there is no target.
      A cap would be arbitrary until spend and output have a stable relationship.
    metric-id: null
    metric-generator: get_ai_spend_per_issue
    tags: [engineering, impact, ai, AKKR, legacy]
    unit: currency

  # ── Forward scorecard (SDD era) ──
  # Registered ahead of the Gemba go-live so the adoption curve has a baseline.
  # All pending: no generator, no target. Each description records its unblocker.
  # Spec-to-Production Cycle Time and SDD Adoption % must be instrumented BEFORE
  # go-live — Jira cannot backfill a status that did not exist at the time.
  "SDD Adoption %":
    description: >-
      Eligible production changes completed through the defined SDD workflow ÷ all
      eligible production changes × 100, excluding emergency fixes and pre-approved
      exceptions. Explicitly temporary: retire once adoption holds at target.
      PENDING — needs an eligibility definition and a workflow-evidence field in Jira.
    mgmt_guidance: >-
      This is an input metric; never report it alone.
      AI Code Share reached 88.85% while Issues Shipped stayed flat, so adoption
      without a paired outcome metric proves only that the process changed.
    metric-id: null
    metric-generator: null
    tags: [engineering, sdd, forward, pending]
    unit: percent

  "Spec-to-Production Cycle Time":
    description: >-
      Production deployment timestamp minus the timestamp an approved,
      implementation-ready spec entered Engineering. Report median and P85 by month;
      exclude paused time only against a documented external dependency.
      PENDING — LEAN has no spec-approved state (Open, In Progress, In Review,
      Reopened, Done), and Jira cannot reconstruct a status retroactively.
    mgmt_guidance: >-
      This is latency, not throughput — halving it proves nothing about volume,
      because throughput equals WIP ÷ cycle time.
      Pair it with a throughput measure before claiming a 2×–3× delivery gain.
    metric-id: null
    metric-generator: null
    tags: [engineering, sdd, forward, pending]

  "Escaped Defect Rate":
    description: >-
      Severity-weighted defects first discovered after production release ÷ releases
      (or customer-active change units) in the period. Fixed weights Sev1=10, Sev2=5,
      Sev3=2, Sev4=1; always publish the unweighted count alongside.
      PENDING — needs release records, a severity field, and the Customer-Reported
      Bugs intake cleanup (enhancement requests are still landing as bugs).
    mgmt_guidance: >-
      Supersedes Defects per 100 Issues, whose denominator is ticket count.
      Prefer change units over release count as the denominator: releases get more
      frequent under SDD, which would improve the rate mechanically.
    metric-id: null
    metric-generator: null
    tags: [engineering, quality, forward, pending]

  "QA Cycle Time":
    description: >-
      QA accepted/complete timestamp minus ready-for-QA timestamp per change, median
      and P85 monthly, splitting queue time from active test time.
      PENDING — the LEAN workflow has no QA state to measure between.
    mgmt_guidance: >-
      Use this to detect QA becoming the delivery bottleneck as upstream speeds up.
      The split matters more than the total: queue time is a staffing or WIP problem,
      active test time is a tooling problem.
    metric-id: null
    metric-generator: null
    tags: [engineering, quality, forward, pending]

  "SLO Attainment %":
    description: >-
      Per customer-facing SLI, good events ÷ total valid events over the SLO window
      against its target; report share of SLOs met and error-budget consumption.

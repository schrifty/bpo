  # Customer-Reported Bugs
  "Customer-Reported Bugs":
    description: >-
      Count of open LEAN Bug issues in active engineering statuses (Open,
      Reopened, In Progress, In Review)—the same slice as the engineering
      portfolio Bug Health slide. Computed from Jira by get_customer_reported_bugs.
    metric-id: 2035
    metric-generator: get_customer_reported_bugs
    tags: [engineering, quality]
    target: 25
    direction: lower

  # Tickets Beyond Service Thresholds
  "Tickets Beyond Service Thresholds":
    description: >-
      Count of open HELP (JSM) tickets at high priority (Critical, Blocker, or
      Major) that are not yet resolved, excluding operational noise labelled
      Outage or healthcheck. Computed from a Jira JQL count by
      get_service_threshold_tickets.
    metric-id: 2028
    metric-generator: get_service_threshold_tickets
    tags: [support, sla]
    target: 50
    direction: lower

  # Site Uptime %
  "Site Uptime %":
    description: null

      Total AI tokens (input + output) consumed by the team's Cursor usage over a
      trailing 30-day window, summed from Cursor Admin API usage events by
      get_ai_token_usage.
    metric-id: null
    metric-generator: get_ai_token_usage
    tags: [ai, engineering, adoption]
    target: 1
    direction: higher

  "Monthly AI Spend":
    description: >-
      Projected team-wide Cursor AI spend (USD) for the current calendar month.
      Real month-to-date charged cost from usage events is kept as-is; remaining
      days are estimated from the average daily spend over a trailing 90-day
      window that includes those MTD actuals (get_monthly_ai_spend). Prefers
      real MTD over extrapolation.
    metric-id: null
    metric-generator: get_monthly_ai_spend

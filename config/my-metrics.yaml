      Percentage of code changes significantly supported by AI
      (AI-assisted PRs ÷ total PRs). Generator blocked until a reliable
      per-PR AI-assistance signal exists beyond Cursor attribution trailers
      (label, check, or commit-level Cursor Blame).
    metric-id: null
    metric-generator: null
    tags: [mfr, engineering, adoption, ai]

  "% of AI-Assisted Automated PRs":
    description: >-
      Percentage of merged PRs significantly supported by AI ÷ total merged PRs
      in the trailing window. AI support is detected from Cursor attribution on
      the PR (Made with Cursor / Co-authored-by: Cursor / cursoragent author or
      labels). Engineer-scoped when the Engineering Department roster is
      available (get_ai_assisted_automated_prs_pct).
    metric-id: null
    metric-generator: get_ai_assisted_automated_prs_pct
    tags: [mfr, engineering, adoption, ai]
    target: 50
    direction: higher

  "Tokens per Dev":
